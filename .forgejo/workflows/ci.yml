name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  python:
    runs-on: docker
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Install Python tooling
        run: |
          apt-get update
          apt-get install -y --no-install-recommends python3 python3-venv python3-pip
          python3 -m venv .venv-ci
          . .venv-ci/bin/activate
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          if [ -f requirements-dev.txt ]; then pip install -r requirements-dev.txt; fi
          if find . -maxdepth 3 -type d -name tests | grep -q .; then pip install pytest; fi
      - name: Compile Python sources
        run: |
          python3 - <<'PY'
          import compileall
          import pathlib
          import sys

          excluded = {'.git', '.forgejo', '.venv-ci', '__pycache__'}
          roots = [p for p in pathlib.Path('.').iterdir() if p.name not in excluded]
          ok = True
          for root in roots:
              if root.is_dir():
                  ok = compileall.compile_dir(str(root), quiet=1, legacy=False) and ok
              elif root.suffix == '.py':
                  ok = compileall.compile_file(str(root), quiet=1, legacy=False) and ok
          sys.exit(0 if ok else 1)
          PY
      - name: Run pytest when tests exist
        run: |
          . .venv-ci/bin/activate
          if find . -maxdepth 3 -type d -name tests | grep -q .; then
            python -m pytest
          else
            echo "No tests directory found; compile check only."
          fi

  publish-container:
    name: Publish container images
    needs: [python]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: [docker, slate-builder]
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Install Docker CLI and Buildx
        run: |
          apt-get update
          apt-get install --yes --no-install-recommends ca-certificates curl
          install -m 0755 -d /etc/apt/keyrings
          curl -fsSL https://download.docker.com/linux/debian/gpg -o /etc/apt/keyrings/docker.asc
          chmod a+r /etc/apt/keyrings/docker.asc
          . /etc/os-release
          test "$ID" = debian
          printf '%s\n' \
            "Types: deb" \
            "URIs: https://download.docker.com/linux/debian" \
            "Suites: $VERSION_CODENAME" \
            "Components: stable" \
            "Architectures: $(dpkg --print-architecture)" \
            "Signed-By: /etc/apt/keyrings/docker.asc" \
            > /etc/apt/sources.list.d/docker.sources
          apt-get update
          apt-get install --yes --no-install-recommends docker-ce-cli docker-buildx-plugin
          docker version
          docker buildx version
      - name: Trust the SeasonalNet Harbor CA
        run: update-ca-certificates
      - name: Log in to Harbor
        env:
          HARBOR_CI_USERNAME: ${{ secrets.HARBOR_CI_USERNAME }}
          HARBOR_CI_PASSWORD: ${{ secrets.HARBOR_CI_PASSWORD }}
        run: printf '%s' "$HARBOR_CI_PASSWORD" | docker login registry.lan.seasonalnet.org --username "$HARBOR_CI_USERNAME" --password-stdin
      - name: Build and push image
        shell: bash
        run: |
          set -euo pipefail
          image="registry.lan.seasonalnet.org/seasonalnet/cme-weather"
          tags=(--tag "$image:sha-${GITHUB_SHA:0:12}")
          if [[ "$GITHUB_REF" == refs/heads/main ]]; then
            tags+=(--tag "$image:latest")
          elif [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            tags+=(--tag "$image:$GITHUB_REF_NAME" --tag "$image:latest")
          fi
          docker buildx build --push "${tags[@]}" --file Dockerfile .
