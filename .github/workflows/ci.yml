name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  version:
    name: Resolve and validate software version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.metadata.outputs.version }}
      revision: ${{ steps.metadata.outputs.revision }}
      timestamp: ${{ steps.metadata.outputs.timestamp }}
      image_tag: ${{ steps.metadata.outputs.image_tag }}
      stable: ${{ steps.metadata.outputs.stable }}
    steps:
      - name: Check out complete Git history and tags
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - name: Test Git version resolution
        run: sh tools/test-version.sh
      - name: Resolve build identity and validate release tags
        id: metadata
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            version="$(sh tools/version.sh --release "$GITHUB_REF_NAME")"
            image_tag="$(sh tools/version.sh --image-tag "$GITHUB_REF_NAME")"
            stable="$(sh tools/version.sh --stable "$GITHUB_REF_NAME")"
          else
            version="$(sh tools/version.sh)"
            image_tag=""
            stable=false
          fi
          printf 'version=%s\nrevision=%s\ntimestamp=%s\nimage_tag=%s\nstable=%s\n' \
            "$version" "$(sh tools/version.sh --revision)" "$(sh tools/version.sh --timestamp)" \
            "$image_tag" "$stable" >> "$GITHUB_OUTPUT"

  python:
    env:
      APP_VERSION: ${{ needs.version.outputs.version }}
      APP_REVISION: ${{ needs.version.outputs.revision }}
      APP_BUILD_DATE: ${{ needs.version.outputs.timestamp }}
    needs: [version]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Install Python tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends python3 python3-venv python3-pip
          python3 -m venv .venv-bootstrap
          . .venv-bootstrap/bin/activate
          python -m pip install --upgrade pip uv==0.13.5
          uv python install 3.15.1
          uv venv --python 3.15.1 .venv-ci
          if [ -f requirements.txt ]; then uv pip install --python .venv-ci/bin/python -r requirements.txt; fi
          if [ -f requirements-dev.txt ]; then uv pip install --python .venv-ci/bin/python -r requirements-dev.txt; fi
          if find . -maxdepth 3 -type d -name tests | grep -q .; then uv pip install --python .venv-ci/bin/python pytest; fi
      - name: Audit Python dependencies
        run: uv tool run --from pip-audit pip-audit --requirement requirements.txt --requirement requirements-dev.txt
      - name: Compile Python sources
        run: |
          . .venv-ci/bin/activate
          python3 - <<'PY'
          import compileall
          import pathlib
          import sys

          excluded = {'.git', '.forgejo', '.venv-ci', '__pycache__'}
          roots = [p for p in pathlib.Path('.').iterdir() if p.name not in excluded]
          ok = True
          for root in roots:
              if root.is_dir():
                  ok = compileall.compile_dir(str(root), quiet=1, legacy=False) and ok
              elif root.suffix == '.py':
                  ok = compileall.compile_file(str(root), quiet=1, legacy=False) and ok
          sys.exit(0 if ok else 1)
          PY
      - name: Run pytest when tests exist
        run: |
          . .venv-ci/bin/activate
          if find . -maxdepth 3 -type d -name tests | grep -q .; then
            python -m pytest
          else
            echo "No tests directory found; compile check only."
          fi

  security:
    uses: ./.github/workflows/security.yml

  publish-container:
    env:
      APP_VERSION: ${{ needs.version.outputs.version }}
      APP_REVISION: ${{ needs.version.outputs.revision }}
      APP_BUILD_DATE: ${{ needs.version.outputs.timestamp }}
      IMAGE_TAG: ${{ needs.version.outputs.image_tag }}
      IMAGE_STABLE: ${{ needs.version.outputs.stable }}
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [python, security, version]
    permissions:
      contents: read
      packages: write
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Log in to GHCR
        run: printf '%s' "$GITHUB_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push image
        shell: bash
        run: |
          set -euo pipefail
          owner="${GITHUB_REPOSITORY%/*}"
          owner="$(printf '%s' "$owner" | tr '[:upper:]' '[:lower:]')"
          image="ghcr.io/$owner/cme-weather"
          tags=(--tag "$image:sha-${GITHUB_SHA:0:12}")
          if [[ "$GITHUB_REF" == refs/heads/main ]]; then
            tags+=(--tag "$image:latest")
          elif [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            tags+=(--tag "$image:$IMAGE_TAG")
            if [[ "$IMAGE_STABLE" == true ]]; then tags+=(--tag "$image:latest"); fi
          fi
          sh tools/build-image.sh --push "${tags[@]}" --file Dockerfile .
