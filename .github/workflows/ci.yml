name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Install Python tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends python3 python3-venv python3-pip
          python3 -m venv .venv-ci
          . .venv-ci/bin/activate
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          if [ -f requirements-dev.txt ]; then pip install -r requirements-dev.txt; fi
          if find . -maxdepth 3 -type d -name tests | grep -q .; then pip install pytest; fi
      - name: Compile Python sources
        run: |
          python3 - <<'PY'
          import compileall
          import pathlib
          import sys

          excluded = {'.git', '.forgejo', '.venv-ci', '__pycache__'}
          roots = [p for p in pathlib.Path('.').iterdir() if p.name not in excluded]
          ok = True
          for root in roots:
              if root.is_dir():
                  ok = compileall.compile_dir(str(root), quiet=1, legacy=False) and ok
              elif root.suffix == '.py':
                  ok = compileall.compile_file(str(root), quiet=1, legacy=False) and ok
          sys.exit(0 if ok else 1)
          PY
      - name: Run pytest when tests exist
        run: |
          . .venv-ci/bin/activate
          if find . -maxdepth 3 -type d -name tests | grep -q .; then
            python -m pytest
          else
            echo "No tests directory found; compile check only."
          fi

  security:
    uses: ./.github/workflows/security.yml

  publish-container:
    needs: [python, security]
    permissions:
      contents: read
      packages: write
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Log in to GHCR
        run: printf '%s' "$GITHUB_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push image
        shell: bash
        run: |
          set -euo pipefail
          owner="${GITHUB_REPOSITORY%/*}"
          owner="$(printf '%s' "$owner" | tr '[:upper:]' '[:lower:]')"
          image="ghcr.io/$owner/cme-weather"
          tags=(--tag "$image:sha-${GITHUB_SHA:0:12}")
          if [[ "$GITHUB_REF" == refs/heads/main ]]; then
            tags+=(--tag "$image:latest")
          elif [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            tags+=(--tag "$image:$GITHUB_REF_NAME" --tag "$image:latest")
          fi
          docker buildx build --push "${tags[@]}" --file Dockerfile .
