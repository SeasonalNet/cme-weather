services:
  cme-weather:
    build: .
    image: cme-weather:local
    restart: unless-stopped
    init: true
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,mode=1777
    ports:
      - "127.0.0.1:${PUBLISH_PORT:-9010}:9010"
    environment:
      GUNICORN_CMD_ARGS: --worker-tmp-dir /tmp
    volumes:
      - type: bind
        source: ${CONFIG_FILE:-./config.yaml}
        target: /run/config/cme-weather.yaml
        read_only: true
        bind:
          create_host_path: false
